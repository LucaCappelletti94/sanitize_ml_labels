name: MyPy Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-26.04
    container: python:3.9
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Install dependencies
        run: |
          pip install ".[test]"
          pip install mypy  # Ensure mypy is installed

      - name: Run MyPy
        run: mypy sanitize_ml_labels/
